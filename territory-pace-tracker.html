<script>
const SEED=``;

//LOGIC-START
const HOL={};
const D=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(Date.UTC(a,b-1,c))};
const iso=d=>d.toISOString().slice(0,10);
function obs(y,m,d){const t=new Date(Date.UTC(y,m,d)),w=t.getUTCDay();if(w===6)t.setUTCDate(d-1);if(w===0)t.setUTCDate(d+1);return iso(t)}
function nth(y,m,dow,n){const f=new Date(Date.UTC(y,m,1)).getUTCDay();return iso(new Date(Date.UTC(y,m,1+((dow-f+7)%7)+(n-1)*7)))}
function lastDow(y,m,dow){const L=new Date(Date.UTC(y,m+1,0));return iso(new Date(Date.UTC(y,m,L.getUTCDate()-((L.getUTCDay()-dow+7)%7))))}
function holidays(y){if(!HOL[y])HOL[y]=new Set([obs(y,0,1),lastDow(y,4,1),obs(y,6,4),nth(y,8,1,1),nth(y,10,4,4),obs(y,11,25)]);return HOL[y]}
function sellingDays(a,b){let n=0;for(let t=D(a).getTime(),e=D(b).getTime();t<=e;t+=864e5){const d=new Date(t),w=d.getUTCDay();if(w>0&&w<6&&!holidays(d.getUTCFullYear()).has(iso(d)))n++}return n}

function parseCSV(t){const rows=[];let row=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
  else f+=c}
 row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}


function headerless(rows,text){
 const isDate=s=>/^\s*\d{4}\/\d{2}\/\d{2}\s*$/.test(s||'');
 const num=s=>{let x=String(s||'').trim();const neg=/^\(.*\)$/.test(x)||x.startsWith('-')||x.endsWith('-');const v=parseFloat(x.replace(/[$,\s()\-]/g,''));return isFinite(v)?(neg?-v:v):0};
 let data=rows;
 if(!rows.some(r=>r.length>6)){ // maybe tab-less copy: split on 2+ spaces
  data=text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.trim().split(/\s{2,}|\t/));
 }
 const dealers=[];
 data.forEach(r=>{
  r=r.map(c=>String(c).trim());
  if(!/^\d{3,}$/.test(r[0]||'')||r.some(c=>/totals/i.test(c)))return;
  const lo=r.findIndex(isDate);if(lo<0)return;
  const rest=r.slice(lo);
  // page layout: lastorder,lastpay,lastnote,balance,mtd,ytd,prior12 ; csv: lastorder,lastpay,balance,mtd,mtdcr,ytd,ytdcr,prior12
  const csv=r.length===16&&!isDate(rest[2]);
  const d=csv?{bal:rest[2],mtd:num(rest[3])+num(rest[4]),ytd:num(rest[5])+num(rest[6]),p12:rest[7],mcr:num(rest[4])}
            :{bal:rest[3],mtd:num(rest[4]),ytd:num(rest[5]),p12:rest[6],mcr:0};
  dealers.push({id:r[0],name:(r[1]||'').replace(/\s+/g,' '),phone:r[2]||'',city:r[3]||'',tc:lo>=6?r[lo-1]:'',
   lo:rest[0].replace(/\//g,'-'),bal:num(d.bal),mcr:d.mcr,mtd:d.mtd,ytd:d.ytd,p12:num(d.p12)});
 });
 if(!dealers.length){
  const preview=text.trim().slice(0,160).replace(/\s+/g,' ');
  throw new Error(preview?'Could not read that. Here is the start of what was pasted: "'+preview+'"':'The paste was empty. In WPS tap Copy to Clipboard first, then paste here.');
 }
 const asOf=dealers.map(d=>d.lo).sort().pop();
 return{asOf,dealers};
}

function toSnapshot(text){
 text=String(text).replace(/^\uFEFF/,'');
 const first=text.split(/\r?\n/).find(l=>l.trim())||'';
 const rows=first.includes('\t')||/\t/.test(text.slice(0,2000))?text.split(/\r?\n/).filter(l=>l.trim()).map(l=>l.split('\t')):parseCSV(text);
 const hi=rows.findIndex(r=>r.some(c=>/dealer/i.test(c))&&r.some(c=>/mtd/i.test(c)));
 if(hi<0)return headerless(rows,text);
 const nk=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
 const h=rows[hi].map(nk);
 const col=(...keys)=>{for(const k of keys){const i=h.indexOf(k);if(i>=0)return i}for(const k of keys){const i=h.findIndex(x=>x.startsWith(k));if(i>=0)return i}return -1};
 const C={id:col('dealer'),name:col('name'),phone:col('phone'),city:col('city'),tc:col('tclevel'),lo:col('lastorder'),bal:col('balance'),mtd:col('mtd'),mcr:h.indexOf('mtdcrrtn'),ytd:col('ytd'),ycr:h.indexOf('ytdcrrtn'),p12:col('prior12')};
 for(const k of ['id','name','lo','mtd','p12'])if(C[k]<0)throw new Error('Missing a needed column ('+k+'). Use Copy to Clipboard or Excel on the WPS Dealers page.');
 const g=(r,k)=>C[k]<0?'':String(r[C[k]]||'').trim();
 const num=s=>{let x=String(s).trim();const neg=/^\(.*\)$/.test(x)||x.startsWith('-')||x.endsWith('-');const v=parseFloat(x.replace(/[$,\s()\-]/g,''));return isFinite(v)?(neg?-v:v):0};
 const dt=s=>{const m=s.match(/(\d{4})\/(\d{2})\/(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null};
 const hasCr=C.mcr>=0,hasYcr=C.ycr>=0;
 const dealers=rows.slice(hi+1).filter(r=>/^\d+$/.test(g(r,'id'))&&g(r,'name')&&!r.some(c=>/totals/i.test(c))).map(r=>({
  id:g(r,'id'),name:g(r,'name').replace(/\s+/g,' '),city:g(r,'city'),tc:g(r,'tc'),phone:g(r,'phone'),
  lo:dt(g(r,'lo')),bal:num(g(r,'bal')),mcr:hasCr?num(g(r,'mcr')):0,
  mtd:num(g(r,'mtd'))+(hasCr?num(g(r,'mcr')):0),ytd:num(g(r,'ytd'))+(hasYcr?num(g(r,'ycr')):0),p12:num(g(r,'p12'))}));
 if(!dealers.length)throw new Error('No dealer rows found in what was pasted.');
 const asOf=dealers.map(d=>d.lo).filter(Boolean).sort().pop();
 if(!asOf)throw new Error('Could not find any order dates.');
 return{asOf,dealers};
}

function compute(index,snaps,settings){
 const asOf=index[index.length-1],s=snaps[asOf],ym=asOf.slice(0,7),y=+asOf.slice(0,4),m=+asOf.slice(5,7);
 const el=Math.max(1,sellingDays(ym+'-01',asOf)),tot=Math.max(el,sellingDays(ym+'-01',iso(new Date(Date.UTC(y,m,0)))));
 const prevDate=index.filter(d=>d<asOf).pop()||null,prev=prevDate?snaps[prevDate]:null;
 const same=prev&&prevDate.slice(0,7)===ym;
 const pm={};if(prev)prev.dealers.forEach(d=>pm[d.id]=d);
 const p12Days=sellingDays(iso(new Date(D(asOf).getTime()-364*864e5)),asOf);
 const yEl=sellingDays(y+'-01-01',asOf),yTot=sellingDays(y+'-01-01',y+'-12-31');
 const goal=settings.goal,ex=new Set(settings.exclude);
 const list=s.dealers.filter(d=>!ex.has(d.id)).map(d=>{
  const avg=d.mtd/el,base=d.p12/p12Days;
  const day=prev?(same?d.mtd-(pm[d.id]?pm[d.id].mtd:0):d.mtd):null;
  return{...d,avg,pct:goal?avg/goal:0,base,norm:base>0?avg/base:null,gap:base*el-d.mtd,day,
   idle:d.lo?Math.round((D(asOf)-D(d.lo))/864e5):null,trend:d.p12>0?(d.ytd/yEl*yTot)/d.p12:null};
 });
 const n=list.length,sum=k=>list.reduce((a,d)=>a+(d[k]||0),0);
 const mtd=sum('mtd'),goalMonth=goal*n*tot,remain=tot-el;
 const ytd=sum('ytd'),p12=sum('p12');
 return{asOf,prevDate,el,tot,n,list,mtd,goalMonth,remain,
  proj:mtd/el*tot,avgPer:n?mtd/(n*el):0,need:remain>0?(goalMonth-mtd)/remain:0,
  ordered:list.filter(d=>d.lo===asOf).length,daySum:prev?sum('day'):null,
  trend:p12>0?(ytd/yEl*yTot)/p12:null};
}
//LOGIC-END

// Saving: uses the phone's browser storage when hosted (GitHub Pages).
// Falls back to memory only if saving is blocked, without throwing errors.
let store='memory';const mem={};
async function pickStore(){
 try{if(window.storage){const r=await window.storage.set('dst:test','1',false);if(r){store='claude';return}}}catch(e){}
 try{const ls=window['local'+'Storage'];ls.setItem('dst:test','1');ls.removeItem('dst:test');store='browser';return}catch(e){}
 store='memory';
}
const canSave=()=>store!=='memory';
const LS=()=>window['local'+'Storage'];
async function sget(k){try{
 if(store==='claude'){const r=await window.storage.get(k,false);return r?JSON.parse(r.value):null}
 if(store==='browser'){const v=LS().getItem(k);return v?JSON.parse(v):null}
 return mem[k]?JSON.parse(mem[k]):null}catch(e){return null}}
async function sset(k,v){try{const s=JSON.stringify(v);
 if(store==='claude')return!!(await window.storage.set(k,s,false));
 if(store==='browser'){LS().setItem(k,s);return true}
 mem[k]=s;return false}catch(e){return false}}
async function sdel(k){try{
 if(store==='claude')await window.storage.delete(k,false);
 else if(store==='browser')LS().removeItem(k);
 else delete mem[k]}catch(e){}}

const monthName=s=>D(s).toLocaleDateString('en-US',{month:'long',timeZone:'UTC'});

async function loadSpecials(){
 try{
  const r=await fetch('specials.html',{cache:'no-cache'});if(!r.ok)throw 0;
  const m=(await r.text()).match(/const PROGRAMS\s*=\s*(\[[\s\S]*?\n\]);/);if(!m)throw 0;

function matchSpecials(brand){

function parseBrandFile(text){

  if(l[0]==='@'){asOf=l.split('|')[1]||null;return}
  const p=l.replace(/^#/,'').split('|');

  else if(p.length===4&&dealers[p[0]])dealers[p[0]].b.push([p[1],+p[2]||0,+p[3]||0]);
 });
 if(!Object.keys(dealers).length)throw new Error('That file has no brand data. Use the brand-data file from Claude.');

}

async function unlockBrands(pass){
 const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
 if(!(window.crypto&&crypto.subtle))throw new Error('Unlocking needs the GitHub Pages version (https).');
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass.trim()),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(LOCKED.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 let txt;try{txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(LOCKED.i)},key,u(LOCKED.c)))}catch(e){throw new Error('That passcode is not right. Check capitals and dashes.')}
 return parseBrandFile(txt);
}

async function init(){
 await pickStore();
 const st=await sget(K.set);
 if(st)settings={...settings,...st};
 index=(await sget(K.idx))||[];
 if(index.length){
  const ym=index[index.length-1].slice(0,7);
  const before=index.filter(d=>d.slice(0,7)<ym).pop();
  for(const d of index.filter(d=>d.slice(0,7)===ym||d===before)){const v=await sget(K.snap(d));if(v)snaps[d]=v}
  index=index.filter(d=>snaps[d]||d<(before||''));
 }
 if(SEED.trim()&&!st&&!Object.keys(snaps).length){await saveSnap(toSnapshot(SEED));await sset(K.set,settings)}
 brands=await sget(K.brands);pitches=(await sget(K.pitch))||[];notes=(await sget(K.notes))||{};await loadSpecials();
 if(!canSave())view.note={t:"Saving is blocked in this preview, so uploads last only until you close it. Open the GitHub Pages version to keep your history."};
 render();
}

function loaded(){return index.filter(d=>snaps[d])}


function pastePanel(){return`<div class="set" style="max-width:720px;margin:0 auto 12px"><b>Paste dealer data</b>
 <p class="hint" style="margin:4px 0 8px">On the WPS Dealers page tap <b>Copy to Clipboard</b>. Then press and hold in the box below and tap Paste.</p>
 <textarea id="pastebox" rows="5" style="width:100%;font:13px ui-monospace,Menlo,monospace;padding:8px;border:1px solid var(--line);border-radius:8px" placeholder="Paste here">${esc(view.pasteText||"")}</textarea>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-act="pasteload">Load pasted data</button>${loaded().length?'<button class="btn line" data-act="pasteclose">Close</button>':''}</div></div>`}
async function loadDealerText(txt){
 try{
  if(!txt.trim())throw new Error('Nothing was pasted yet.');
  const s=toSnapshot(txt);const had=!!snaps[s.asOf];
  const ok=await saveSnap(s);view.tab='dealers';view.paste=false;
  const t=compute(loaded(),snaps,settings);
  view.note={t:`${had?'Replaced':'Added'} sales through ${fmtDate(s.asOf,true)}. ${t.ordered} dealers ordered${t.asOf===s.asOf&&t.daySum!=null?', '+money(t.daySum)+' since the last file':''}.${ok||!canSave()?'':' This day could not be saved, so it will be gone next time.'}`};
 }catch(err){view.note={t:err.message,err:true}}
 render();
}

   return`<div class="stat"><b class="${a<c?'neg':'up'}">${a>=c?'+':''}${money(a-c)}</b><span>Year to date vs. last year (${c?pctTxt(a/c):'n/a'}), brand data ${brands.asOf?fmtDate(brands.asOf):''}</span></div>`})()}

function targetsTab(t){

function lastNote(id){const n=notes[id];return n&&n.length?n[n.length-1]:null}
function followUps(){const out=[];Object.entries(notes).forEach(([id,arr])=>arr.forEach((n,i)=>{if(n.follow&&!n.done)out.push({id,i,...n})}));return out.sort((a,b)=>a.follow.localeCompare(b.follow))}

function specialsTab(t){
 const q=view.sq.toLowerCase(),today=todayIso();
 const live=specials.list.filter(p=>!p.ends||p.ends>=today)
  .filter(p=>!q||(p.name+' '+(p.offer||'')+' '+p.brands.join(' ')).toLowerCase().includes(q))
  .sort((a,b)=>(daysLeft(a.ends)??9999)-(daysLeft(b.ends)??9999));
 const names={};t.list.forEach(d=>names[d.id]=d);
 const fits=p=>{if(!brands)return[];const keys=new Set(p.brands.map(bn));const out=[];
  Object.entries(brands.dealers).forEach(([id,bd])=>{if(settings.exclude.includes(id)||!names[id])return;
   let loss=0,hit=[];bd.b.forEach(([n,a,c])=>{if(keys.has(bn(n))&&a-c<=-250){loss+=c-a;hit.push(brandTitle(n))}});
   if(loss)out.push({id,loss,hit})});return out.sort((a,b)=>b.loss-a.loss)};
 const card=p=>{const dl=daysLeft(p.ends),f=fits(p);
  return`<div class="tg"><h3>${esc(p.name)}</h3>
  <div class="sum"><span class="${dl!=null&&dl<=7?'neg':''}"><em>${dl==null?'Ongoing':dl===0?'Ends today':dl+' days left'}</em></span>${p.local?'<span><em>Your region only</em></span>':''}${p.brands.length?`<span>${esc(p.brands.slice(0,8).join(', '))}${p.brands.length>8?'...':''}</span>`:''}</div>
  ${p.offer?`<p class="hint" style="margin:0 0 8px;color:var(--ink)">${esc(p.offer)}</p>`:''}
  ${brands&&p.brands.length?`<div class="br"><div class="bh"><span>Dealers this fits</span><span>${f.length}</span></div>${f.slice(0,6).map(x=>`<div class="sp"><div>${esc(title(names[x.id].name))}<br><small>${esc(x.hit.join(', '))} down ${money(x.loss)}</small></div><a class="pbtn" href="tel:${esc(names[x.id].phone)}">Call</a></div>`).join('')||'<div class="nomatch">No dealers are down on these brands.</div>'}</div>`:''}
  </div>`};
 return`<div class="tools" style="display:block"><input type="search" id="sq" placeholder="Search a brand or program" value="${esc(view.sq)}"></div>
 <p class="hint">${live.length} live programs from the ${esc(specials.src)}, soonest ending first.${specials.src==='Specials Board'?'':' Full offer details show once the tracker is next to specials.html on GitHub.'}</p>
 <div class="grid">${live.map(card).join('')}</div>`;
}

function dailyTab(t,idx){
 const ym=t.asOf.slice(0,7),ex=new Set(settings.exclude);

 const all=idx;const days=[];
 all.forEach((d,i)=>{if(d.slice(0,7)!==ym)return;const pd=all[i-1];
  const v=tot(snaps[d]);let sales=null;
  if(pd&&pd.slice(0,7)===ym)sales=v-tot(snaps[pd]);else if(pd)sales=v;
  days.push({d,v,sales,ordered:snaps[d].dealers.filter(x=>!ex.has(x.id)&&x.lo===d).length})});
 const withSales=days.filter(x=>x.sales!=null);
 let chart='';
 if(withSales.length){
  const goalDay=settings.goal*t.n,max=Math.max(goalDay,...withSales.map(x=>x.sales))*1.1,W=340,H=150,bw=W/Math.max(withSales.length,8);

  ${withSales.map((x,i)=>{const h=Math.max(1,Math.max(0,x.sales)/max*H);return`<rect x="${i*bw+2}" y="${H-h}" width="${bw-4}" height="${h}" rx="2" fill="${x.sales>=goalDay?'#2E8B57':'#14213D'}"/><text x="${i*bw+bw/2}" y="${H+14}" font-size="10" text-anchor="middle" fill="#5E6778">${+x.d.slice(8)}</text>`}).join('')}
  <line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="#F0A202" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="${W-2}" y="${gy-4}" font-size="10" text-anchor="end" fill="#8A6205">Daily goal ${money(goalDay)}</text></svg></div>`;
 }
 return`<h2>${monthName(t.asOf)} by day</h2>
 ${chart||`<p class="hint">Daily sales appear once you upload a second day's file. Each upload is compared with the one before it.</p>`}
 <h2>Files uploaded</h2>
 ${[...days].reverse().map(x=>`<div class="item"><div><b>${fmtDate(x.d,true)}</b><small>${x.ordered} dealers ordered. ${money(x.v)} month to date</small></div><b>${x.sales==null?'Starting point':money(x.sales)}</b></div>`).join('')}`;
}

document.addEventListener('click',async e=>{

 if(b.dataset.tab){view.tab=b.dataset.tab;view.note=null;render();return}
 if(b.dataset.open){view.open=view.open===b.dataset.open?null:b.dataset.open;render();return}
 if(b.dataset.del){const d=b.dataset.del;if(!confirm('Remove the '+fmtDate(d)+' file?'))return;
  index=index.filter(x=>x!==d);delete snaps[d];await sdel(K.snap(d));await sset(K.idx,index);view.note={t:'Removed '+fmtDate(d)+'.'};render();return}
 if(b.dataset.act==='upload')document.getElementById('file').click();
 if(b.dataset.act==='brandfile')document.getElementById('bfile').click();
 if(b.dataset.notefor){view.tab='notes';view.nd=b.dataset.notefor;render();return}
 if(b.dataset.act==='addnote'){const id=(document.getElementById('nd')||{}).value,txt=((document.getElementById('ntext')||{}).value||'').trim(),fo=(document.getElementById('nfollow')||{}).value||'';
  if(!id||!txt){view.note={t:'Choose a dealer and type a note first.',err:true};render();return}
  (notes[id]=notes[id]||[]).push({date:todayIso(),text:txt,follow:fo,done:false});view.nd=id;
  const ok=await sset(K.notes,notes);view.note={t:ok||!canSave()?'Note saved.':'Note could not be saved on this device.',err:!(ok||!canSave())};render();return}
 if(b.dataset.done){const [id,i]=b.dataset.done.split('|');if(notes[id]&&notes[id][i]){notes[id][i].done=true;await sset(K.notes,notes)}render();return}
 if(b.dataset.delnote){if(!confirm('Delete this note?'))return;const [id,i]=b.dataset.delnote.split('|');if(notes[id]){notes[id].splice(+i,1);if(!notes[id].length)delete notes[id];await sset(K.notes,notes)}render();return}
 if(b.dataset.act==='copynotes'){const t=compute(loaded(),snaps,settings);const nm=id=>{const d=t.list.find(x=>x.id===id);return d?title(d.name):'#'+id};
  const txt=Object.entries(notes).map(([id,arr])=>nm(id)+'\n'+arr.map(n=>'  '+n.date+': '+n.text+(n.follow?' (follow up '+n.follow+(n.done?', done':'')+')':'')).join('\n')).join('\n\n');
  try{await navigator.clipboard.writeText(txt||'No notes');view.note={t:'All notes copied. Paste them into Notes or an email.'}}catch(e){view.note={t:'Copy was blocked. Try again.',err:true}}render();return}
 if(b.dataset.act==='paste'){view.paste=true;render();return}
 if(b.dataset.act==='pasteclose'){view.paste=false;render();return}
 if(b.dataset.act==='pasteload'){view.pasteText=(document.getElementById('pastebox')||{}).value||'';await loadDealerText(view.pasteText);if(!view.note||!view.note.err)view.pasteText='';return}
 if(b.dataset.act==='unlock'){const v=(document.getElementById('bpass')||{}).value||'';if(!v.trim()){view.note={t:'Type the passcode first.',err:true};render();return}
  try{brands=await unlockBrands(v);const ok=await sset(K.brands,brands);view.tab='targets';view.note={t:`Brand data unlocked for ${Object.keys(brands.dealers).length} dealers.${ok||!canSave()?'':' It could not be saved, so you will need to unlock again next time.'}`}}catch(err){view.note={t:err.message,err:true}}render();return}
 if(b.dataset.pitch){const [id]=b.dataset.pitch.split('|');const t=compute(loaded(),snaps,settings);const d=t.list.find(x=>x.id===id);
  pitches.push({key:b.dataset.pitch,date:todayIso(),ym:t.asOf.slice(0,7),mtd:d?d.mtd:0});await sset(K.pitch,pitches);render();return}
 if(b.dataset.unpitch){if(!confirm('Clear this pitch?'))return;pitches=pitches.filter(x=>x.key!==b.dataset.unpitch);await sset(K.pitch,pitches);render();return}
 if(b.dataset.act==='erase'){if(!confirm('Erase every saved day? This cannot be undone.'))return;
  for(const d of index)await sdel(K.snap(d));index=[];for(const k in snaps)delete snaps[k];await sset(K.idx,[]);await sdel(K.pitch);pitches=[];await sset(K.set,settings);view.note={t:'All saved days erased.'};render()}
});
document.addEventListener('change',async e=>{
 const el=e.target;
 if(el.id==='sort'){view.sort=el.value;render();return}
 if(el.id==='tsort'){view.tsort=el.value;render();return}
 if(el.id==='nd'){view.nd=el.value;render();return}
 if(el.id==='bfile'&&el.files[0]){try{brands=parseBrandFile(await el.files[0].text());const ok=await sset(K.brands,brands);view.tab='targets';view.note={t:`Brand data loaded for ${Object.keys(brands.dealers).length} dealers.${ok||!canSave()?'':' It could not be saved, so it will be gone next time.'}`}}catch(err){view.note={t:err.message,err:true}}el.value='';render();return}
 if(el.id==='goal'||el.id==='idle'){const v=parseFloat(el.value);if(isFinite(v)&&v>=(el.id==='idle'?1:0)){settings[el.id]=v;await sset(K.set,settings);render()}return}
 if(el.dataset.inc){const id=el.dataset.inc;settings.exclude=el.checked?settings.exclude.filter(x=>x!==id):[...settings.exclude,id];await sset(K.set,settings);render();return}
 if(el.id==='file'&&el.files[0]){const f=el.files[0];el.value='';await loadDealerText(await f.text());}
});
let sqT;document.addEventListener('input',e=>{if(e.target.id==='sq'){clearTimeout(sqT);const v=e.target.value;sqT=setTimeout(()=>{view.sq=v;render();const s=document.getElementById('sq');if(s){s.focus();s.setSelectionRange(v.length,v.length)}},400)}});
init();
</script>
